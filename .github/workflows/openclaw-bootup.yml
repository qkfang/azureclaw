name: OpenClaw Bootup

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  start-vm:
    runs-on: ubuntu-latest
    steps:

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start VM
        run: az vm start --resource-group rg-azclaw --name win11-openclaw-vm

      - name: Trigger IaC deploy in opc-playground-shared
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.opc_playground_shared_pat }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/qkfang/opc-playground-shared/actions/workflows/10_deploy_iac.yml/dispatches \
            -d '{"ref":"main"}'
