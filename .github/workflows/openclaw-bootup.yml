name: OpenClaw Bootup

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  start-openclaw:
    runs-on: ubuntu-latest
    steps:

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: IaC (opc-playground-shared)
        env:
          GH_PAT: ${{ secrets.opc_playground_shared_pat }}
          OWNER_REPO: qkfang/opc-playground-shared
          WORKFLOW_FILE: 10_deploy_iac.yml
          REF: main
        run: |
          set -euo pipefail

          api() {
            curl -sf -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          # Record the time just before dispatch (UTC, ISO-8601) to identify the new run.
          DISPATCH_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Dispatch time: ${DISPATCH_TIME}"

          api -X POST \
            "https://api.github.com/repos/${OWNER_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
            -d "{\"ref\":\"${REF}\"}"

          echo "Workflow dispatched. Waiting for the run to appear..."

          # Find the run that was created after we dispatched.
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(api \
              "https://api.github.com/repos/${OWNER_REPO}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&branch=${REF}&created=>${DISPATCH_TIME}&per_page=1" \
              | jq -r '.workflow_runs[0].id // empty')
            if [ -n "${RUN_ID}" ]; then
              echo "Found run id: ${RUN_ID}"
              break
            fi
            echo "Run not visible yet, retrying ($i)..."
            sleep 10
          done

          if [ -z "${RUN_ID}" ]; then
            echo "Timed out waiting for the dispatched run to appear." >&2
            exit 1
          fi

          # Poll until the run completes.
          while true; do
            RUN_JSON=$(api "https://api.github.com/repos/${OWNER_REPO}/actions/runs/${RUN_ID}")
            STATUS=$(echo "${RUN_JSON}" | jq -r '.status')
            CONCLUSION=$(echo "${RUN_JSON}" | jq -r '.conclusion // empty')
            HTML_URL=$(echo "${RUN_JSON}" | jq -r '.html_url')
            echo "Run ${RUN_ID} status: ${STATUS} conclusion: ${CONCLUSION:-pending}"
            if [ "${STATUS}" = "completed" ]; then
              break
            fi
            sleep 15
          done

          echo "Run finished with conclusion: ${CONCLUSION} (${HTML_URL})"
          if [ "${CONCLUSION}" != "success" ]; then
            echo "IaC workflow did not succeed." >&2
            exit 1
          fi

      - name: Start VM
        run: az vm start --resource-group rg-azclaw --name win11-openclaw-vm

