name: Start Azure VM at 6AM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-azclaw
  VM_NAME: win11-openclaw-vm

jobs:
  start-vm:
    runs-on: ubuntu-latest
    steps:

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start VM
        run: az vm start --resource-group "${RESOURCE_GROUP}" --name "${VM_NAME}"
